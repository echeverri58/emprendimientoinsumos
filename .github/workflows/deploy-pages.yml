name: Deploy static app to GitHub Pages

# Compila sin-backend/ y publica sin-backend/dist en GitHub Pages.
#
# Requisito único (manual, una sola vez): en el repo, Settings → Pages →
# "Build and deployment" → Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'sin-backend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --prefix sin-backend

      - name: Compilar
        run: npm run build --prefix sin-backend

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: sin-backend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
